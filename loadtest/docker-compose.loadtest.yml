services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kora_loadtest
      POSTGRES_USER: kora
      POSTGRES_PASSWORD: kora
    ports:
      - "5433:5432"
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=500ms
      - -c
      - log_min_duration_statement=50
    volumes:
      - loadtest-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kora"]
      interval: 2s
      timeout: 3s
      retries: 10

  # Oracle backend for the `*-oracle` load-test recipes. Behind a profile so the
  # default `up` only starts Postgres; only one backend runs at a time (shares
  # port 1521 with the test/dev Oracle — stop those first). Intentionally NO
  # persistent volume: Oracle Free's DB creation is fragile to interruption, and a
  # half-initialised oradata volume fails to restart (ORA-00600 ksipc). Ephemeral
  # means a fresh ~2-4 min boot each run, but robust (matches the test Oracle).
  oracle:
    image: gvenzl/oracle-free:slim
    profiles: ["oracle"]
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: kora
      APP_USER_PASSWORD: kora
    ports:
      - "1521:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 90s

volumes:
  loadtest-pgdata:
