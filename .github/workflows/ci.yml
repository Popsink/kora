# CI — split into focused jobs: lint, helm, postgres backend, oracle backend.
#
# The Rust jobs run inside the project's devbox environment (see devbox.json +
# rust-toolchain.toml), so the toolchain (Rust 1.96.0) and the Oracle Instant
# Client are the exact same pinned versions developers get locally — no ad-hoc
# toolchain action or manual Instant Client download.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # oracle-instantclient is an unfree nixpkgs package; devbox must be allowed to
  # evaluate it when materializing the environment.
  NIXPKGS_ALLOW_UNFREE: "1"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: "true"

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: devbox run -- cargo fmt --check

      - name: Clippy (default)
        run: devbox run -- cargo clippy -- -D warnings -D clippy::all -D clippy::pedantic

      # The `oracle` crate vendors ODPI-C, compiled by gcc; no Instant Client is
      # needed for a compile-only check. The runtime path is exercised by the
      # `oracle` job.
      - name: Clippy (oracle feature)
        run: devbox run -- cargo clippy --features oracle -- -D warnings -D clippy::all -D clippy::pedantic

  postgres:
    name: Postgres backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kora
          POSTGRES_USER: kora
          POSTGRES_PASSWORD: kora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kora"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://kora:kora@localhost:5432/kora

    steps:
      - uses: actions/checkout@v7

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: "true"

      - uses: Swatinem/rust-cache@v2

      - name: Integration suite against Postgres
        run: devbox run -- cargo test --test '*' -- --include-ignored

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-test-logs
          path: target/tmp/
          retention-days: 14

  oracle:
    name: Oracle backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      oracle:
        image: gvenzl/oracle-free:slim
        env:
          ORACLE_PASSWORD: oracle
          APP_USER: kora
          APP_USER_PASSWORD: kora
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 40
          --health-start-period 90s

    env:
      # The same Confluent-compatible integration suite, run against Oracle. The
      # `oracle` crate is a thick ODPI-C / OCI driver; the Oracle Instant Client
      # comes from devbox (see devbox.json), which puts it on LD_LIBRARY_PATH.
      DATABASE_URL: ""
      DB_BACKEND: oracle
      DB_HOST: localhost
      DB_PORT: "1521"
      DB_USER: kora
      DB_PASSWORD: kora
      DB_NAME: FREEPDB1
      # Keep per-test pools small so the parallel suite does not exhaust Oracle
      # Free's session limit.
      DB_POOL_MAX: "2"

    steps:
      - uses: actions/checkout@v7

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: "true"

      - uses: Swatinem/rust-cache@v2

      - name: Integration suite against Oracle
        # Oracle Free is capped at 2 CPU threads and shares this runner with the
        # test workload; keep concurrency low so concurrent connection creation
        # doesn't overwhelm it. devbox's init_hook puts the Instant Client on
        # LD_LIBRARY_PATH for the driver to load.
        run: devbox run -- cargo test --features oracle --test '*' -- --include-ignored --test-threads=2

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: oracle-test-logs
          path: target/tmp/
          retention-days: 14

  helm:
    name: Helm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Build dependencies
        run: helm dependency build chart/

      - name: Lint chart
        run: helm lint chart/ --set database.host=lint --set database.password=lint

      - name: Template (component — inline password)
        run: |
          out=$(helm template kora chart/ --set database.host=test --set database.password=test)
          grep -q 'kind: Secret' <<<"$out"
          grep -q 'name: kora-db' <<<"$out"
          grep -q 'key: "password"' <<<"$out"
          grep -q 'name: DB_HOST' <<<"$out"

      - name: Template (component — existing secret)
        run: |
          out=$(helm template kora chart/ --set database.host=test --set database.existingSecret=my-secret --set database.secretKeys.password=db-password)
          ! grep -q 'kind: Secret' <<<"$out"
          grep -q 'name: my-secret' <<<"$out"
          grep -q 'key: "db-password"' <<<"$out"

      - name: Template (URL — inline)
        run: |
          out=$(helm template kora chart/ --set database.url=postgres://u:p@h/d)
          grep -q 'kind: Secret' <<<"$out"
          grep -q 'name: DATABASE_URL' <<<"$out"
          ! grep -q 'name: DB_HOST' <<<"$out"

      - name: Template (URL — existing secret)
        run: |
          out=$(helm template kora chart/ --set database.existingSecret=my-secret --set database.secretKeys.url=DATABASE_URL)
          ! grep -q 'kind: Secret' <<<"$out"
          grep -q 'name: my-secret' <<<"$out"
          grep -q 'key: "DATABASE_URL"' <<<"$out"

      - name: Template (mutually exclusive — must fail)
        run: |
          assert_fail() {
            local msg=$1
            shift
            out=$(helm template kora chart/ "$@" 2>&1) && { echo "expected fail, got success"; echo "$out"; exit 1; }
            grep -q "$msg" <<<"$out" || { echo "expected message '$msg', got:"; echo "$out"; exit 1; }
          }
          assert_fail 'mutually exclusive' --set database.url=postgres://u:p@h/d --set database.existingSecret=my-secret
          assert_fail 'mutually exclusive' --set database.host=h --set database.password=p --set database.existingSecret=my-secret
          assert_fail 'mutually exclusive' --set database.url=postgres://u:p@h/d --set database.password=p
