# Release — automated via release-plz
#
# After CI passes on main, release-plz either:
#   - Creates/updates a Release PR (version bump + CHANGELOG)
#   - Or, if the Release PR was just merged, creates tag + GitHub Release
#
# The Release PR is your "release button" — merge it when you want to publish.
# On release: builds multi-arch Docker image + packages Helm chart, pushes both to GHCR.
#
# Each platform × variant is built on its own native runner to avoid QEMU emulation,
# then merged into a single multi-arch manifest per variant.

name: Release

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without v prefix, e.g. 1.2.3)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/popsink/kora
  CHART: oci://ghcr.io/popsink/kora/charts

jobs:
  release-plz:
    name: release-plz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - uses: Swatinem/rust-cache@v2

      - name: Run release-plz
        id: release
        uses: release-plz/action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        if: steps.release.outputs.releases_created == 'true'
        id: version
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          VERSION=$(echo "$RELEASES" | jq -r '.[0].version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.variant }}, ${{ matrix.platform_pair }})
    needs: release-plz
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.release-plz.outputs.releases_created == 'true'
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: postgres
            dockerfile: dockerfiles/postgres.Dockerfile
            platform: linux/amd64
            platform_pair: linux-amd64
            runner: ubuntu-latest-8-cores
          - variant: postgres
            dockerfile: dockerfiles/postgres.Dockerfile
            platform: linux/arm64
            platform_pair: linux-arm64
            runner: ubuntu-24.04-arm
          - variant: oracle
            dockerfile: dockerfiles/oracle.Dockerfile
            platform: linux/amd64
            platform_pair: linux-amd64
            runner: ubuntu-latest-8-cores
          - variant: oracle
            dockerfile: dockerfiles/oracle.Dockerfile
            platform: linux/arm64
            platform_pair: linux-arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.platform_pair }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.platform_pair }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.platform_pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [release-plz, build]
    if: >-
      needs.build.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       needs.release-plz.outputs.releases_created == 'true')
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: postgres
          - variant: oracle

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.variant }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        env:
          VERSION: ${{ inputs.version || needs.release-plz.outputs.version }}
          VARIANT: ${{ matrix.variant }}
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:v${VERSION}-${VARIANT} \
            -t ${{ env.IMAGE }}:latest-${VARIANT} \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [release-plz, merge]
    if: >-
      needs.merge.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       needs.release-plz.outputs.releases_created == 'true')
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Log in to GHCR
        env:
          HELM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${HELM_TOKEN}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Stamp chart version
        env:
          VERSION: ${{ inputs.version || needs.release-plz.outputs.version }}
        run: |
          sed -i "s|^version:.*|version: ${VERSION}|" chart/Chart.yaml
          sed -i "s|^appVersion:.*|appVersion: ${VERSION}|" chart/Chart.yaml

      - name: Build Helm dependencies
        run: helm dependency build chart/

      - name: Lint chart
        run: helm lint chart/ --set database.host=lint --set database.password=lint

      - name: Package chart
        run: helm package chart/

      - name: Push chart to GHCR
        env:
          VERSION: ${{ inputs.version || needs.release-plz.outputs.version }}
        run: helm push "kora-${VERSION}.tgz" ${{ env.CHART }}
