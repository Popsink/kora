{{- if and .Values.auth.admin.existingSecret .Values.auth.admin.password -}}
{{- fail "auth.admin.existingSecret is mutually exclusive with auth.admin.password — pick one source" -}}
{{- end -}}
{{- if .Values.auth.admin.username -}}
{{- include "kora.requireValueOrExistingSecret" (dict "value" .Values.auth.admin.password "existingSecret" .Values.auth.admin.existingSecret "message" "auth.admin.username requires auth.admin.password or auth.admin.existingSecret") -}}
{{- end -}}
{{- if and .Values.auth.admin.username .Values.auth.admin.password (not .Values.auth.admin.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kora.authSecretName" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{ .Values.auth.admin.secretKeys.password }}: {{ .Values.auth.admin.password | b64enc | quote }}
{{- end }}
