[package]
name = "kora"
version = "0.3.3"
edition = "2024"

[features]
default = []
# Compile the Oracle backing-store driver (`oracle://` / DB_BACKEND=oracle).
# Off by default so the standard build stays minimal. The driver is the pure-Rust
# `oracle-rs` (no OCI/ODPI-C, no Oracle Instant Client) — an Oracle-enabled build
# is still a single self-contained binary that connects over TCP, same as Postgres.
oracle = ["dep:oracle-rs", "dep:deadpool"]

[dependencies]
apache-avro = "0.21.0"
async-trait = "0.1.83"
axum = { version = "0.8.9", features = ["macros"] }
deadpool = { version = "0.12.3", optional = true, features = ["rt_tokio_1"] }
figment = { version = "0.10.19", features = ["env"] }
hex = "0.4"
oracle-rs = { version = "0.1.7", optional = true }
jsonschema = { version = "0.46.5", default-features = false }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
prost-types = "0.14.3"
protox-parse = "0.9"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros", "uuid", "chrono", "json"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.7.0", features = ["set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
urlencoding = "2.1"
uuid = { version = "1.23.2", features = ["v4", "serde"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true

[dev-dependencies]
figment = { version = "0.10.19", features = ["env", "test"] }
reqwest = { version = "0.13.4", features = ["json"] }
serial_test = { version = "3.5.0", features = ["file_locks"] }
tokio-test = "0.4.5"
